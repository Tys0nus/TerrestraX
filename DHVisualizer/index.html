<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DH Parameter Visualizer - Multi-Chain</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <!-- Left Sidebar Controls -->
        <div id="controls">
            <h2>DH Visualizer</h2>
            
            <!-- Robot Selection -->
            <div class="control-section">
                <label for="robotSelect">Robot:</label>
                <select id="robotSelect">
                    <option value="">Select a robot...</option>
                </select>
            </div>

            <!-- Robot Actions -->
            <div class="control-section">
                <div class="button-group">
                    <button id="newRobotBtn" class="btn-primary">New</button>
                    <button id="exportRobotBtn" class="btn-secondary">Export</button>
                    <button id="importRobotBtn" class="btn-secondary">Import</button>
                </div>
                <input type="file" id="importFileInput" accept=".json" style="display: none;">
            </div>

            <!-- Chain Management -->
            <div class="control-section">
                <h3>Chains</h3>
                <div class="button-group" style="margin-bottom: 10px;">
                    <button id="addChainBtn" class="btn-primary">+ Chain</button>
                    <button id="showAllChains" class="btn-success">Show All</button>
                    <button id="hideAllChains" class="btn-neutral">Hide All</button>
                </div>
                <div id="chainList"></div>
            </div>

            <!-- Task Space Control -->
            <div class="control-section">
                <h3>Task Space</h3>
                <div id="taskSpaceControls"></div>
            </div>
        </div>

        <!-- 3D Viewport -->
        <div id="viewport"></div>

        <!-- Bottom Panel for DH Parameters -->
        <div id="bottom-panel">
            <div id="bottom-panel-header">
                <h3>DH Parameters</h3>
                <button id="toggleBottomPanel" class="btn-neutral">▼ Hide</button>
            </div>
            <div id="bottom-panel-content">
                <div id="dhTables"></div>
            </div>
        </div>
    </div>

    <!-- Modal Dialogs -->
    <div id="newRobotModal" class="modal">
        <div class="modal-content">
            <h3>Create New Robot</h3>
            <label>Robot Name:</label>
            <input type="text" id="newRobotName" placeholder="My Robot">
            <label>Convention:</label>
            <select id="newRobotConvention">
                <option value="standard">Standard DH</option>
                <option value="modified">Modified DH</option>
            </select>
            <div class="modal-buttons">
                <button id="createRobotBtn">Create</button>
                <button id="cancelRobotBtn">Cancel</button>
            </div>
        </div>
    </div>

    <div id="newChainModal" class="modal">
        <div class="modal-content">
            <h3>Add New Chain</h3>
            <label>Chain ID:</label>
            <input type="text" id="newChainId" placeholder="arm1">
            <label>Chain Name:</label>
            <input type="text" id="newChainName" placeholder="Robot Arm">
            <label>Number of Joints:</label>
            <input type="number" id="newChainJoints" min="1" max="10" value="3">
            <label>Base Position (X, Y, Z in meters):</label>
            <div style="display: flex; gap: 5px;">
                <input type="number" id="baseX" step="0.01" value="0" placeholder="X">
                <input type="number" id="baseY" step="0.01" value="0" placeholder="Y">
                <input type="number" id="baseZ" step="0.01" value="0" placeholder="Z">
            </div>
            <div class="modal-buttons">
                <button id="addChainConfirmBtn">Add Chain</button>
                <button id="cancelChainBtn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Three.js Library - Using Import Maps for ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <!-- Application Scripts -->
    <script type="module" src="js/math.js"></script>
    <script type="module" src="js/robots.js"></script>
    <script type="module" src="js/dhChain.js"></script>
    <script type="module" src="js/three-setup.js"></script>
    <script type="module" src="js/tabs.js"></script>
    <script type="module" src="js/ui-controls.js"></script>
    <script type="module" src="js/robot-editor.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
