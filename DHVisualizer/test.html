<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DH Visualizer - API Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #0f0;
            padding: 20px;
            line-height: 1.6;
        }
        .console {
            background: #000;
            border: 2px solid #0f0;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            max-height: 400px;
            overflow-y: auto;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
        }
        button:hover {
            background: #0c0;
        }
        .success { color: #0f0; }
        .error { color: #f00; }
        .info { color: #0ff; }
    </style>
</head>
<body>
    <h1>🤖 DH Visualizer - API Test Console</h1>
    <p>This page tests the DH Visualizer API to ensure all components work correctly.</p>
    
    <div>
        <button onclick="testMathFunctions()">Test Math Functions</button>
        <button onclick="testRobotDefinitions()">Test Robot Definitions</button>
        <button onclick="testForwardKinematics()">Test Forward Kinematics</button>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="clearConsole()">Clear Console</button>
    </div>
    
    <div id="console" class="console">
        <div class="info">Console ready. Click a test button to begin.</div>
    </div>

    <script type="module">
        import { 
            dhTransform, 
            multiplyMatrices, 
            forwardKinematics, 
            degToRad, 
            radToDeg,
            getPosition,
            computeIK,
            identityMatrix
        } from './js/math.js';
        
        import { robots, getRobot, getAllRobotIds } from './js/robots.js';

        // Make functions available globally for onclick
        window.testMathFunctions = testMathFunctions;
        window.testRobotDefinitions = testRobotDefinitions;
        window.testForwardKinematics = testForwardKinematics;
        window.runAllTests = runAllTests;
        window.clearConsole = clearConsole;

        const consoleDiv = document.getElementById('console');

        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleDiv.appendChild(div);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function clearConsole() {
            consoleDiv.innerHTML = '<div class="info">Console cleared.</div>';
        }

        function testMathFunctions() {
            log('=== Testing Math Functions ===', 'info');
            
            try {
                // Test identity matrix
                const I = identityMatrix();
                log('✓ Identity matrix created: ' + JSON.stringify(I[0]), 'success');
                
                // Test DH transform
                const T = dhTransform(0.1, Math.PI/2, 0.05, Math.PI/4);
                log('✓ DH transform computed (a=0.1, α=90°, d=0.05, θ=45°)', 'success');
                
                // Test matrix multiplication
                const result = multiplyMatrices(I, T);
                log('✓ Matrix multiplication works', 'success');
                
                // Test position extraction
                const pos = getPosition(T);
                log(`✓ Position extracted: x=${pos.x.toFixed(4)}, y=${pos.y.toFixed(4)}, z=${pos.z.toFixed(4)}`, 'success');
                
                // Test angle conversions
                const deg = radToDeg(Math.PI);
                const rad = degToRad(180);
                log(`✓ Angle conversion: π rad = ${deg}°, 180° = ${rad.toFixed(4)} rad`, 'success');
                
                // Test IK stub
                const ikResult = computeIK({id: 'test'}, {x:0, y:0, z:0}, [0,0,0]);
                if (ikResult === null) {
                    log('✓ IK stub returns null as expected (not implemented)', 'success');
                }
                
                log('=== All Math Tests Passed ===', 'success');
                
            } catch (error) {
                log(`✗ Math test failed: ${error.message}`, 'error');
            }
        }

        function testRobotDefinitions() {
            log('=== Testing Robot Definitions ===', 'info');
            
            try {
                // Test getting all robot IDs
                const ids = getAllRobotIds();
                log(`✓ Found ${ids.length} robots: ${ids.join(', ')}`, 'success');
                
                // Test each robot
                ids.forEach(id => {
                    const robot = getRobot(id);
                    if (robot) {
                        log(`✓ Robot '${id}': ${robot.name} (${robot.chains.length} chains)`, 'success');
                        
                        // Validate chains
                        robot.chains.forEach(chain => {
                            log(`  → Chain '${chain.id}': ${chain.name} (${chain.joints.length} joints)`, 'info');
                            
                            // Validate base transform
                            if (chain.baseTransform && chain.baseTransform.length === 4) {
                                log(`    ✓ Base transform valid`, 'success');
                            }
                            
                            // Validate joints
                            chain.joints.forEach((joint, idx) => {
                                if (typeof joint.a === 'number' && 
                                    typeof joint.alpha === 'number' &&
                                    typeof joint.d === 'number' &&
                                    typeof joint.theta === 'number') {
                                    // Valid
                                } else {
                                    log(`    ✗ Joint ${idx} has invalid parameters`, 'error');
                                }
                            });
                        });
                    }
                });
                
                log('=== All Robot Definition Tests Passed ===', 'success');
                
            } catch (error) {
                log(`✗ Robot definition test failed: ${error.message}`, 'error');
            }
        }

        function testForwardKinematics() {
            log('=== Testing Forward Kinematics ===', 'info');
            
            try {
                // Get spider robot
                const spider = getRobot('quadruped_spider');
                
                if (!spider) {
                    throw new Error('Spider robot not found');
                }
                
                log(`✓ Testing FK on ${spider.name}`, 'info');
                
                // Test each chain
                spider.chains.forEach(chainDef => {
                    log(`  Testing chain: ${chainDef.name} (${chainDef.id})`, 'info');
                    
                    // Zero angles
                    const angles = new Array(chainDef.joints.length).fill(0);
                    const transforms = forwardKinematics(chainDef, angles, spider.convention);
                    
                    log(`    ✓ FK computed ${transforms.length} transforms`, 'success');
                    
                    // Get end-effector position
                    const eeTransform = transforms[transforms.length - 1];
                    const eePos = getPosition(eeTransform);
                    
                    log(`    → EE position (zero angles): x=${eePos.x.toFixed(4)}, y=${eePos.y.toFixed(4)}, z=${eePos.z.toFixed(4)}`, 'info');
                    
                    // Test with non-zero angles
                    const testAngles = [degToRad(30), degToRad(-45), degToRad(60)];
                    const transforms2 = forwardKinematics(chainDef, testAngles, spider.convention);
                    const eePos2 = getPosition(transforms2[transforms2.length - 1]);
                    
                    log(`    → EE position (30°,-45°,60°): x=${eePos2.x.toFixed(4)}, y=${eePos2.y.toFixed(4)}, z=${eePos2.z.toFixed(4)}`, 'info');
                });
                
                log('=== All Forward Kinematics Tests Passed ===', 'success');
                
            } catch (error) {
                log(`✗ FK test failed: ${error.message}`, 'error');
            }
        }

        function runAllTests() {
            clearConsole();
            log('Running all tests...', 'info');
            log('', 'info');
            
            setTimeout(() => {
                testMathFunctions();
                log('', 'info');
            }, 100);
            
            setTimeout(() => {
                testRobotDefinitions();
                log('', 'info');
            }, 500);
            
            setTimeout(() => {
                testForwardKinematics();
                log('', 'info');
                log('=== ALL TESTS COMPLETED ===', 'success');
            }, 1000);
        }

        // Auto-run tests on load
        log('Page loaded. Click "Run All Tests" to verify the API.', 'info');
    </script>
</body>
</html>
