#VRML_SIM R2023b utf8
PROTO SpiderRobotStatic [
  field SFVec3f    translation     0 0.05 0
  field SFRotation rotation        0 0 1 0
  field SFColor    bodyColor       0.3 0.3 0.3
  field SFColor    legColor        0.2 0.2 0.2
  field SFVec3f    bodySize        0.12 0.04 0.08
