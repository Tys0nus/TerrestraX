      HingeJoint {
        jointParameters HingeJointParameters {
          position 0
          axis 0 1 0
          anchor 0.06 0 0.04
        }
        device [
          RotationalMotor {
            name "coxa_motor_0"
            maxTorque 2.0
          }
          PositionSensor {
            name "coxa_sensor_0"
          }
        ]
        endPoint Solid {
          translation 0.06 0 0.04
          rotation 0 0 1 1.5708
          children [
            Shape {
              appearance Appearance {
                material Material {
                  diffuseColor IS legColor
                }
              }
              geometry Cylinder {
                height IS coxaLength
